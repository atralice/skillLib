name: Release

# Push a tag like v1.0.1 (matching package.json's version) to publish to npm.
# Publishing uses npm trusted publishing (OIDC): no token, no 2FA prompt.
# Configure it once on npmjs.com → skilllib → Settings → Trusted Publisher:
#   GitHub Actions · atralice / skillLib · workflow: release.yml
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version)"; exit 1
          fi

      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

      - name: Publish to npm
        run: npm publish --access public

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
