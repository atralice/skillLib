name: Release

# On every push to main, release-please keeps one release PR up to date: the next version,
# worked out from the Conventional Commits since the last release, and its CHANGELOG.
# Merging that PR tags vX.Y.Z and creates the GitHub release; the publish job then puts it on npm.
# Publishing uses npm trusted publishing (OIDC): no token, no 2FA prompt.
# Configure it once on npmjs.com → skilllib → Settings → Trusted Publisher:
#   GitHub Actions · atralice / skillLib · workflow: release.yml
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, releases, its branch
      pull-requests: write # the release PR
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@12.2.2

      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

      - name: Publish to npm
        run: npm publish --access public
