name: Release

# On every push to main, release-please keeps one release PR up to date: the next version,
# worked out from the Conventional Commits since the last release, and its CHANGELOG.
# Merging that PR tags vX.Y.Z and creates the GitHub release; the publish job then puts it on npm.
# Publishing uses npm trusted publishing (OIDC): no token, no 2FA prompt.
# Configure it once on npmjs.com → skilllib → Settings → Trusted Publisher:
#   GitHub Actions · atralice / skillLib · workflow: release.yml
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, releases, its branch
      pull-requests: write # the release PR
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

      - name: Publish to npm
        run: npm publish --access public
