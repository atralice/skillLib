name: Test

on:
  pull_request:
  push:
    branches: [main]

# The tests only read the repo.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      # The packed CLI must start and report its version.
      - run: node dist/index.js --version
      # The latest npm must publish package.json as-is (it silently drops
      # fields it considers invalid, e.g. a "./"-prefixed bin path).
      - name: npm accepts package.json
        if: runner.os == 'Linux'
        run: |
          npx -y npm@latest publish --dry-run --provenance=false 2>&1 | tee publish.log
          if grep -q "auto-corrected" publish.log; then echo "::error::npm would rewrite package.json — run: npx npm@latest pkg fix"; exit 1; fi
